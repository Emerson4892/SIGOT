name: SIGOT

on:
  push:
    branches: [main, master]

  pull_request:

  workflow_dispatch:
    inputs:
      publicar_imagenes:
        description: Publicar imagenes en Docker Hub
        type: boolean
        default: false

      desplegar:
        description: Desplegar SIGOT en DigitalOcean
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"

  POSTGRES_USER: sigot
  POSTGRES_PASSWORD: sigot_ci_password
  POSTGRES_DB: sigot

  JWT_ACCESS_SECRET: sigot-ci-jwt-secret-de-al-menos-32-caracteres

  SEED_DEMO_USERS: "true"
  SEED_ADMIN_PASSWORD: CiAdmin123!
  SEED_OPERATOR_PASSWORD: CiOperador123!
  SEED_SUPERVISOR_PASSWORD: CiSupervisor123!
  SEED_TECHNICIAN_PASSWORD: CiTecnico123!
  SEED_WAREHOUSE_PASSWORD: CiBodega123!

jobs:

  pruebas:
    name: Instalar, probar y compilar
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: sigot
          POSTGRES_PASSWORD: sigot_ci_password
          POSTGRES_DB: sigot

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U sigot -d sigot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test

      DATABASE_URL: postgresql://sigot:sigot_ci_password@localhost:5432/sigot
      TEST_DATABASE_URL: postgresql://sigot:sigot_ci_password@localhost:5432/sigot_test

      CORS_ORIGIN: http://127.0.0.1:5174
      APP_URL: http://127.0.0.1:5174

      COOKIE_SECURE: "false"
      LOG_LEVEL: silent

    steps:

      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Comprobar que no se versionan secretos
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.production$|(^|/)\.seed-credentials$|\.pem$' || true)

          if [ -n "$tracked" ]; then
            echo "Hay secretos versionados:"
            printf '%s\n' "$tracked"
            exit 1
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Generar cliente Prisma
        working-directory: backend
        run: npx prisma generate

      - name: Ejecutar pruebas del backend
        working-directory: backend
        run: npm test

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Compilar frontend
        working-directory: frontend
        run: npm run build

      - name: Ejecutar pruebas del frontend y PWA
        working-directory: frontend
        run: npm test

      - name: Instalar Chromium para Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas de interfaz
        working-directory: frontend
        run: npm run test:e2e

      - name: Revisar dependencias
        run: |
          npm --prefix backend audit --omit=dev || true
          npm --prefix frontend audit || true

  imagenes:
    name: Construir imagenes Docker
    needs: pruebas
    runs-on: ubuntu-latest

    steps:

      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir backend
        run: docker build -t sigot-backend:${{ github.sha }} ./backend

      - name: Construir frontend
        run: docker build -t sigot-frontend:${{ github.sha }} ./frontend

      - name: Construir proxy
        run: docker build -t sigot-proxy:${{ github.sha }} -f deploy/Dockerfile.proxy deploy

      - name: Validar Compose de produccion
        run: |
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config --format json > /tmp/sigot-compose.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          compose = json.loads(Path('/tmp/sigot-compose.json').read_text())
          servicios = compose['services']

          puertos = {
              str(p['published'])
              for s in servicios.values()
              for p in s.get('ports', [])
              if isinstance(p, dict) and 'published' in p
          }

          for puerto in ('5432', '4000'):
              if puerto in puertos:
                  raise SystemExit(f'Puerto privado {puerto} publicado')

          for puerto in ('80', '443'):
              if puerto not in puertos:
                  raise SystemExit(f'Falta publicar puerto {puerto}')

          imagenes = {s.get('image') for s in servicios.values()}

          requeridas = (
              'postgres:17',
              'sigot-backend:local',
              'sigot-frontend:local',
              'sigot-proxy:local',
              'certbot/certbot:v2.11.0',
          )

          for nombre in requeridas:
              if nombre not in imagenes:
                  raise SystemExit(f'Falta imagen {nombre}')

          entorno = servicios['backend'].get('environment', {})

          if str(entorno.get('SEED_DEMO_USERS')).lower() != 'false':
              raise SystemExit('SEED_DEMO_USERS debe ser false')

          if str(entorno.get('COOKIE_SECURE')).lower() != 'true':
              raise SystemExit('COOKIE_SECURE debe ser true')

          print('Compose de produccion valido')
          PY

      - name: Validar Nginx
        run: |
          docker run --rm \
            -v "$PWD/deploy/nginx-bootstrap.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

          docker run --rm \
            -v "$PWD/deploy/nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine \
            sh -c "apk add --no-cache openssl >/dev/null && mkdir -p /tmp/sigot-certs && openssl req -x509 -nodes -newkey rsa:2048 -keyout /tmp/sigot-certs/privkey.pem -out /tmp/sigot-certs/fullchain.pem -subj /CN=localhost -days 1 && nginx -t"

  publicar:
    name: Publicar imagenes en Docker Hub
    needs: imagenes
    runs-on: ubuntu-latest

    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && (inputs.publicar_imagenes == true || inputs.desplegar == true)) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SIGOT_DEPLOY_ENABLED == 'true')
      }}

    steps:

      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Comprobar credenciales Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}

        run: |
          set -euo pipefail

          docker build \
            -t "$DOCKERHUB_USERNAME/sigot-backend:$SHA" \
            -t "$DOCKERHUB_USERNAME/sigot-backend:$REF" \
            ./backend

          docker build \
            -t "$DOCKERHUB_USERNAME/sigot-frontend:$SHA" \
            -t "$DOCKERHUB_USERNAME/sigot-frontend:$REF" \
            ./frontend

          docker push "$DOCKERHUB_USERNAME/sigot-backend:$SHA"
          docker push "$DOCKERHUB_USERNAME/sigot-backend:$REF"

          docker push "$DOCKERHUB_USERNAME/sigot-frontend:$SHA"
          docker push "$DOCKERHUB_USERNAME/sigot-frontend:$REF"

  desplegar:
    name: Desplegar en DigitalOcean

    needs: [imagenes, publicar]

    if: >-
      ${{
        !cancelled() &&
        needs.imagenes.result == 'success' &&
        needs.publicar.result == 'success' &&
        github.ref == 'refs/heads/main' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.desplegar == true) ||
          (github.event_name == 'push' && vars.SIGOT_DEPLOY_ENABLED == 'true')
        )
      }}

    runs-on: ubuntu-latest
    environment: production

    concurrency:
      group: sigot-production
      cancel-in-progress: false

    steps:

      - name: Configurar y validar conexion SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DIGITALOCEAN_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DIGITALOCEAN_KNOWN_HOSTS }}

        run: |
          set -euo pipefail

          if [ -z "$SSH_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::Faltan DIGITALOCEAN_SSH_KEY o DIGITALOCEAN_KNOWN_HOSTS"
            exit 1
          fi

          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/known_hosts"

          if ! ssh-keygen -y -P "" -f "$HOME/.ssh/id_ed25519" > /dev/null 2>&1; then
            echo "::error::DIGITALOCEAN_SSH_KEY no contiene una clave privada SSH valida sin passphrase"
            exit 1
          fi

          echo "Clave privada SSH validada correctamente"

      - name: Verificar acceso SSH a DigitalOcean
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DIGITALOCEAN_HOST }}
          DEPLOY_USER: ${{ secrets.DIGITALOCEAN_USER }}

        run: |
          set -euo pipefail

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"

          ssh -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              -i "$HOME/.ssh/id_ed25519" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              'echo "Conexion SSH exitosa"'

      - name: Desplegar SIGOT
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DIGITALOCEAN_HOST }}
          DEPLOY_USER: ${{ secrets.DIGITALOCEAN_USER }}

        run: |
          set -euo pipefail

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"

          ssh -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -i "$HOME/.ssh/id_ed25519" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              'sudo -n /usr/local/sbin/sigot-deploy.sh'

      - name: Verificar aplicacion por HTTPS
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://sigot.emersontzib.site/ -o /dev/null

          echo "SIGOT responde correctamente por HTTPS"