name: SIGOT - Integracion Continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-sigot:
    name: Verificar frontend y backend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo de SIGOT
        uses: actions/checkout@v6

      - name: Construir frontend React
        run: docker build -t sigot-frontend-ci ./frontend

      - name: Construir backend Node.js
        run: docker build -t sigot-backend-ci ./backend

      - name: Confirmar compilacion
        run: echo "SIGOT - Construccion de Docker completada"