services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-sigot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigot} -d ${POSTGRES_DB:-sigot}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sigot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sigot}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Defina JWT_ACCESS_SECRET en .env}
      JWT_ACCESS_TTL: 15m
      REFRESH_TTL_DAYS: 7
      CORS_ORIGIN: http://localhost:8080
      APP_URL: http://localhost:8080
      COOKIE_SECURE: "false"
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: 8
      LOG_LEVEL: info
      TRUST_PROXY: "false"
      LOG_RESET_LINKS: "true"
      SEED_DEMO_USERS: "true"
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD}
      SEED_SUPERVISOR_PASSWORD: ${SEED_SUPERVISOR_PASSWORD}
      SEED_TECHNICIAN_PASSWORD: ${SEED_TECHNICIAN_PASSWORD}
      SEED_WAREHOUSE_PASSWORD: ${SEED_WAREHOUSE_PASSWORD}
    volumes:
      - uploads:/app/uploads
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/salud').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/salud"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
